apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ct-framework-o11y
  namespace: argocd
spec:
  project: default
  source:
    repoURL: REPLACE_WITH_REPO_URL
    targetRevision: main
    path: deploy/gitops/apps-o11y
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
