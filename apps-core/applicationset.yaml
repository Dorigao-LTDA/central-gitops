apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: repo-discovery
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/Dorigao-LTDA/central-gitops.git
        revision: main
        directories:
          - path: tenants/*/apps/*
  template:
    metadata:
      name: '{{path.basename}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/Dorigao-LTDA/central-gitops.git
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: app
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
