apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yas-media-mock
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Dorigao-LTDA/central-gitops.git
    targetRevision: main
    path: deploy/helm/service-chart
    helm:
      valueFiles:
        - ../values/yas-media-mock.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
