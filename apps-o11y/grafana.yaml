apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: "10.5.15"
    helm:
      values: |
        adminPassword: "changeme"
        service:
          type: ClusterIP
        plugins:
          - grafana-pyroscope-datasource
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
            - name: Mimir
              uid: mimir
              type: prometheus
              url: http://mimir-gateway.observability.svc.cluster.local:80/prometheus
              access: proxy
              isDefault: true
              jsonData:
                httpMethod: POST
                prometheusType: Mimir
            - name: Loki
              uid: loki
              type: loki
              url: http://loki.observability.svc.cluster.local:3100
              access: proxy
              jsonData:
                maxLines: 1000
            - name: Tempo
              uid: tempo
              type: tempo
              url: http://tempo.observability.svc.cluster.local:3200
              access: proxy
              jsonData:
                tracesToLogs:
                  datasourceUid: loki
                  tags: ["service_name","k8s_namespace_name","k8s_pod_name"]
                  mappedTags:
                    - key: service_name
                      value: service_name
                  mapTagNamesEnabled: true
                serviceMap:
                  datasourceUid: mimir
                nodeGraph:
                  enabled: true
            - name: Pyroscope
              uid: pyroscope
              type: grafana-pyroscope-datasource
              url: http://pyroscope.observability.svc.cluster.local:4040
              access: proxy

        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: fixed
                orgId: 1
                folder: "TCC Fixed"
                type: file
                disableDeletion: false
                editable: true
                updateIntervalSeconds: 30
                options:
                  path: /var/lib/grafana/dashboards/fixed

        sidecar:
          dashboards:
            enabled: true
            label: grafana_dashboard
            labelValue: "1"
            folder: /var/lib/grafana/dashboards/fixed
            searchNamespace: observability

        dashboards:
          fixed:
            k8s-health:
              json: |-
                {
                  "schemaVersion": 39,
                  "uid": "k8s-health",
                  "title": "K8s Cluster Health",
                  "tags": ["tcc","k8s"],
                  "timezone": "browser",
                  "refresh": "30s",
                  "time": {"from": "now-1h", "to": "now"},
                  "templating": {
                    "list": [
                      {"name": "namespace", "type": "query", "datasource": {"type": "prometheus", "uid": "mimir"}, "query": "label_values(kube_pod_status_phase, namespace)", "refresh": 2, "includeAll": true, "current": {"text": "All", "value": "$__all"}}
                    ]
                  },
                  "panels": [
                    {"id": 1, "type": "stat", "title": "Pods Running", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "count(kube_pod_status_phase{phase=\"Running\",namespace=~\"$namespace\"})", "refId": "A"}], "gridPos": {"x": 0, "y": 0, "w": 6, "h": 4}, "options": {"reduceOptions": {"calcs": ["last"], "values": false}}},
                    {"id": 2, "type": "stat", "title": "Pods Not Ready", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "count(kube_pod_status_ready{condition=\"true\",namespace=~\"$namespace\"} == 0)", "refId": "A"}], "gridPos": {"x": 6, "y": 0, "w": 6, "h": 4}, "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}}} ,
                    {"id": 3, "type": "stat", "title": "Total Restarts (last 1h)", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\"}[1h]))", "refId": "A"}], "gridPos": {"x": 12, "y": 0, "w": 6, "h": 4}, "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 3}, {"color": "red", "value": 10}]}}}} ,
                    {"id": 4, "type": "stat", "title": "OOMKilled Pods (last 1h)", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "sum(increase(kube_pod_container_status_terminated_reason{reason=\"OOMKilled\",namespace=~\"$namespace\"}[1h]))", "refId": "A"}], "gridPos": {"x": 18, "y": 0, "w": 6, "h": 4}, "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}}} ,
                    {"id": 5, "type": "timeseries", "title": "Pod Restarts Over Time", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\"}[5m])", "legendFormat": "{{namespace}}/{{pod}}/{{container}}", "refId": "A"}], "gridPos": {"x": 0, "y": 4, "w": 24, "h": 8}},
                    {"id": 6, "type": "table", "title": "Pods with Issues", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "kube_pod_container_status_terminated_reason{namespace=~\"$namespace\"}", "format": "table", "instant": true, "refId": "A"}], "gridPos": {"x": 0, "y": 12, "w": 24, "h": 8}, "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true, "Value": true, "__name__": true, "container": false, "namespace": false, "pod": false, "reason": false}}}]},
                    {"id": 7, "type": "timeseries", "title": "Deployment Ready vs Desired Replicas", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "kube_deployment_status_replicas_available{namespace=~\"$namespace\"}", "legendFormat": "{{namespace}}/{{deployment}} ready", "refId": "A"}, {"expr": "kube_deployment_status_replicas_desired{namespace=~\"$namespace\"}", "legendFormat": "{{namespace}}/{{deployment}} desired", "refId": "B"}], "gridPos": {"x": 0, "y": 20, "w": 24, "h": 8}}
                  ]
                }
            container-resources:
              json: |-
                {
                  "schemaVersion": 39,
                  "uid": "container-resources",
                  "title": "Container Resources (Memory & CPU)",
                  "tags": ["tcc","k8s","resources"],
                  "timezone": "browser",
                  "refresh": "15s",
                  "time": {"from": "now-1h", "to": "now"},
                  "templating": {
                    "list": [
                      {"name": "namespace", "type": "query", "datasource": {"type": "prometheus", "uid": "mimir"}, "query": "label_values(container_memory_working_set_bytes, namespace)", "refresh": 2, "includeAll": true, "current": {"text": "All", "value": "$__all"}}
                    ]
                  },
                  "panels": [
                    {"id": 1, "type": "timeseries", "title": "Memory Working Set (bytes)", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "container_memory_working_set_bytes{namespace=~\"$namespace\",container!=\"\",container!=\"POD\"}", "legendFormat": "{{namespace}}/{{pod}}/{{container}}", "refId": "A"}], "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit": "bytes"}}},
                    {"id": 2, "type": "timeseries", "title": "Memory Usage vs Limit (%)", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "container_memory_working_set_bytes{namespace=~\"$namespace\",container!=\"\",container!=\"POD\"} / on(namespace,pod,container) kube_pod_container_resource_limits{resource=\"memory\",namespace=~\"$namespace\"} * 100", "legendFormat": "{{pod}}/{{container}}", "refId": "A"}], "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit": "percent", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 70}, {"color": "red", "value": 85}]}}}},
                    {"id": 3, "type": "timeseries", "title": "CPU Usage (cores)", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\",container!=\"\",container!=\"POD\"}[5m])", "legendFormat": "{{namespace}}/{{pod}}/{{container}}", "refId": "A"}], "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit": "none"}}},
                    {"id": 4, "type": "timeseries", "title": "CPU Usage vs Limit (%)", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\",container!=\"\",container!=\"POD\"}[5m]) / on(namespace,pod,container) kube_pod_container_resource_limits{resource=\"cpu\",namespace=~\"$namespace\"} * 100", "legendFormat": "{{pod}}/{{container}}", "refId": "A"}], "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit": "percent", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 70}, {"color": "red", "value": 90}]}}}},
                    {"id": 5, "type": "stat", "title": "Pods > 85% Memory Limit", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "count(container_memory_working_set_bytes{namespace=~\"$namespace\",container!=\"\",container!=\"POD\"} / on(namespace,pod,container) kube_pod_container_resource_limits{resource=\"memory\"} > 0.85)", "refId": "A"}], "gridPos": {"x": 0, "y": 16, "w": 8, "h": 4}, "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}}},
                    {"id": 6, "type": "stat", "title": "Top Pod by Memory", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "topk(1, container_memory_working_set_bytes{namespace=~\"$namespace\",container!=\"\",container!=\"POD\"})", "refId": "A", "instant": true}], "gridPos": {"x": 8, "y": 16, "w": 16, "h": 4}, "fieldConfig": {"defaults": {"unit": "bytes"}}}
                  ]
                }
            node-resources:
              json: |-
                {
                  "schemaVersion": 39,
                  "uid": "node-resources",
                  "title": "Node Resources",
                  "tags": ["tcc","node"],
                  "timezone": "browser",
                  "refresh": "30s",
                  "time": {"from": "now-1h", "to": "now"},
                  "panels": [
                    {"id": 1, "type": "timeseries", "title": "CPU Usage % per Node", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "100 * (1 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) by (node))", "legendFormat": "{{node}}", "refId": "A"}], "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit": "percent", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 70}, {"color": "red", "value": 85}]}}}},
                    {"id": 2, "type": "timeseries", "title": "Memory Usage % per Node", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "(node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100", "legendFormat": "{{node}}", "refId": "A"}], "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit": "percent", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 70}, {"color": "red", "value": 85}]}}}},
                    {"id": 3, "type": "timeseries", "title": "Disk Available (root)", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "node_filesystem_avail_bytes{mountpoint=\"/\",fstype!~\"tmpfs|overlay\"}", "legendFormat": "{{node}}", "refId": "A"}], "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit": "bytes"}}},
                    {"id": 4, "type": "timeseries", "title": "Network RX/TX (bytes/s)", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "rate(node_network_receive_bytes_total{device!~\"lo\"}[5m])", "legendFormat": "RX {{node}}", "refId": "A"}, {"expr": "rate(node_network_transmit_bytes_total{device!~\"lo\"}[5m])", "legendFormat": "TX {{node}}", "refId": "B"}], "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit": "Bps"}}},
                    {"id": 5, "type": "timeseries", "title": "Load Average", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "node_load1", "legendFormat": "{{node}}", "refId": "A"}], "gridPos": {"x": 0, "y": 16, "w": 24, "h": 6}}
                  ]
                }
            jvm-runtime:
              json: |-
                {
                  "schemaVersion": 39,
                  "uid": "jvm-runtime",
                  "title": "JVM Runtime (per Service)",
                  "tags": ["tcc","jvm","java"],
                  "timezone": "browser",
                  "refresh": "15s",
                  "time": {"from": "now-1h", "to": "now"},
                  "templating": {
                    "list": [
                      {"name": "service", "type": "query", "datasource": {"type": "prometheus", "uid": "mimir"}, "query": "label_values(jvm_memory_used_bytes, service_name)", "refresh": 2, "includeAll": true, "current": {"text": "All", "value": "$__all"}}
                    ]
                  },
                  "panels": [
                    {"id": 1, "type": "timeseries", "title": "Heap Used vs Max (bytes)", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "jvm_memory_used_bytes{area=\"heap\",service_name=~\"$service\"}", "legendFormat": "used {{service_name}} {{id}}", "refId": "A"}, {"expr": "jvm_memory_max_bytes{area=\"heap\",service_name=~\"$service\"}", "legendFormat": "max {{service_name}} {{id}}", "refId": "B"}], "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit": "bytes"}}},
                    {"id": 2, "type": "timeseries", "title": "Heap Usage %", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "jvm_memory_used_bytes{area=\"heap\",service_name=~\"$service\"} / jvm_memory_max_bytes{area=\"heap\",service_name=~\"$service\"} * 100", "legendFormat": "{{service_name}} {{id}}", "refId": "A"}], "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit": "percent", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 70}, {"color": "red", "value": 85}]}}}},
                    {"id": 3, "type": "timeseries", "title": "GC Pause Time (s/s)", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "rate(jvm_gc_pause_seconds_sum{service_name=~\"$service\"}[5m])", "legendFormat": "{{service_name}} {{action}} {{cause}}", "refId": "A"}], "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit": "s"}}},
                    {"id": 4, "type": "timeseries", "title": "GC Count (/s)", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "rate(jvm_gc_pause_seconds_count{service_name=~\"$service\"}[5m])", "legendFormat": "{{service_name}} {{action}}", "refId": "A"}], "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8}},
                    {"id": 5, "type": "timeseries", "title": "Process CPU Usage", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "process_cpu_usage{service_name=~\"$service\"}", "legendFormat": "{{service_name}}", "refId": "A"}], "gridPos": {"x": 0, "y": 16, "w": 12, "h": 7}, "fieldConfig": {"defaults": {"unit": "percentunit"}}},
                    {"id": 6, "type": "timeseries", "title": "Thread States", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "jvm_threads_states_threads{service_name=~\"$service\"}", "legendFormat": "{{service_name}} {{state}}", "refId": "A"}], "gridPos": {"x": 12, "y": 16, "w": 12, "h": 7}},
                    {"id": 7, "type": "timeseries", "title": "Non-Heap Memory", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "jvm_memory_used_bytes{area=\"nonheap\",service_name=~\"$service\"}", "legendFormat": "{{service_name}} {{id}}", "refId": "A"}], "gridPos": {"x": 0, "y": 23, "w": 24, "h": 7}, "fieldConfig": {"defaults": {"unit": "bytes"}}}
                  ]
                }
            http-red:
              json: |-
                {
                  "schemaVersion": 39,
                  "uid": "http-red",
                  "title": "HTTP RED (per Service — span metrics)",
                  "tags": ["tcc","red","traces"],
                  "timezone": "browser",
                  "refresh": "15s",
                  "time": {"from": "now-1h", "to": "now"},
                  "templating": {
                    "list": [
                      {"name": "service", "type": "query", "datasource": {"type": "prometheus", "uid": "mimir"}, "query": "label_values(traces_spanmetrics_calls_total, service)", "refresh": 2, "includeAll": true, "current": {"text": "All", "value": "$__all"}}
                    ]
                  },
                  "panels": [
                    {"id": 1, "type": "timeseries", "title": "Request Rate (req/s)", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "sum(rate(traces_spanmetrics_calls_total{service=~\"$service\",span_kind=\"SPAN_KIND_SERVER\"}[5m])) by (service)", "legendFormat": "{{service}}", "refId": "A"}], "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit": "reqps"}}},
                    {"id": 2, "type": "timeseries", "title": "Error Rate %", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "sum(rate(traces_spanmetrics_calls_total{service=~\"$service\",span_kind=\"SPAN_KIND_SERVER\",status_code=\"STATUS_CODE_ERROR\"}[5m])) by (service) / sum(rate(traces_spanmetrics_calls_total{service=~\"$service\",span_kind=\"SPAN_KIND_SERVER\"}[5m])) by (service) * 100", "legendFormat": "{{service}}", "refId": "A"}], "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit": "percent", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}, {"color": "red", "value": 5}]}}}},
                    {"id": 3, "type": "timeseries", "title": "P95 Latency (s)", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "histogram_quantile(0.95, sum(rate(traces_spanmetrics_latency_bucket{service=~\"$service\",span_kind=\"SPAN_KIND_SERVER\"}[5m])) by (le, service))", "legendFormat": "{{service}} p95", "refId": "A"}], "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit": "s"}}},
                    {"id": 4, "type": "timeseries", "title": "P99 Latency (s)", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "histogram_quantile(0.99, sum(rate(traces_spanmetrics_latency_bucket{service=~\"$service\",span_kind=\"SPAN_KIND_SERVER\"}[5m])) by (le, service))", "legendFormat": "{{service}} p99", "refId": "A"}], "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit": "s"}}},
                    {"id": 5, "type": "timeseries", "title": "Request Rate by Operation (req/s)", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "sum(rate(traces_spanmetrics_calls_total{service=~\"$service\",span_kind=\"SPAN_KIND_SERVER\"}[5m])) by (service, span_name)", "legendFormat": "{{service}} {{span_name}}", "refId": "A"}], "gridPos": {"x": 0, "y": 16, "w": 24, "h": 8}, "fieldConfig": {"defaults": {"unit": "reqps"}}},
                    {"id": 6, "type": "stat", "title": "Top Error Rate Service", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "topk(1, sum(rate(traces_spanmetrics_calls_total{service=~\"$service\",status_code=\"STATUS_CODE_ERROR\"}[5m])) by (service) / sum(rate(traces_spanmetrics_calls_total{service=~\"$service\"}[5m])) by (service) * 100)", "refId": "A", "instant": true}], "gridPos": {"x": 0, "y": 24, "w": 24, "h": 4}, "fieldConfig": {"defaults": {"unit": "percent"}}}
                  ]
                }
            logs-traces:
              json: |-
                {
                  "schemaVersion": 39,
                  "uid": "logs-traces",
                  "title": "Logs & Traces Explorer",
                  "tags": ["tcc","logs","traces"],
                  "timezone": "browser",
                  "refresh": "30s",
                  "time": {"from": "now-1h", "to": "now"},
                  "templating": {
                    "list": [
                      {"name": "service", "type": "query", "datasource": {"type": "loki", "uid": "loki"}, "query": "label_values({k8s_namespace_name=\"app\"}, service_name)", "refresh": 2, "includeAll": true, "current": {"text": "All", "value": ".*"}},
                      {"name": "search", "type": "textbox", "default": "ERROR"}
                    ]
                  },
                  "panels": [
                    {"id": 1, "type": "timeseries", "title": "Log Rate by Service (lines/5m)", "datasource": {"type": "loki", "uid": "loki"}, "targets": [{"expr": "sum by (service_name) (count_over_time({k8s_namespace_name=\"app\", service_name=~\"$service\"} [5m]))", "legendFormat": "{{service_name}}", "refId": "A"}], "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8}},
                    {"id": 2, "type": "timeseries", "title": "Error Logs by Service (ERROR lines/5m)", "datasource": {"type": "loki", "uid": "loki"}, "targets": [{"expr": "sum by (service_name) (count_over_time({k8s_namespace_name=\"app\", service_name=~\"$service\"} |= \"$search\" [5m]))", "legendFormat": "{{service_name}} ERR", "refId": "A"}], "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}}},
                    {"id": 3, "type": "logs", "title": "Recent Error Logs (with traceId)", "datasource": {"type": "loki", "uid": "loki"}, "targets": [{"expr": "{k8s_namespace_name=\"app\", service_name=~\"$service\"} |= \"$search\"", "refId": "A"}], "gridPos": {"x": 0, "y": 8, "w": 24, "h": 10}, "options": {"showTime": true, "showLabels": true, "dedupStrategy": "none"}},
                    {"id": 4, "type": "table", "title": "Top 10 Error Traces by Service (Tempo)", "datasource": {"type": "tempo", "uid": "tempo"}, "targets": [{"expr": "{ resource.service.name =~ \"$service\" AND status = error }", "refId": "A", "limit": 10}], "gridPos": {"x": 0, "y": 18, "w": 24, "h": 10}},
                    {"id": 5, "type": "table", "title": "Slowest Traces > 500ms (Tempo)", "datasource": {"type": "tempo", "uid": "tempo"}, "targets": [{"refId": "A", "queryType": "traceql-search", "expr": "{ resource.service.name =~ \"$service\" } | duration > 500ms", "limit": 10}], "gridPos": {"x": 0, "y": 28, "w": 24, "h": 10}}
                  ]
                }
            http-red-micrometer:
              json: |-
                {
                  "schemaVersion": 39,
                  "uid": "http-red-micrometer",
                  "title": "HTTP RED (Micrometer — per Service)",
                  "tags": ["tcc","red","http","micrometer"],
                  "timezone": "browser",
                  "refresh": "15s",
                  "time": {"from": "now-1h", "to": "now"},
                  "templating": {
                    "list": [
                      {"name": "service", "type": "query", "datasource": {"type": "prometheus", "uid": "mimir"}, "query": "label_values(http_server_requests_seconds_count, service_name)", "refresh": 2, "includeAll": true, "current": {"text": "All", "value": "$__all"}}
                    ]
                  },
                  "panels": [
                    {"id": 1, "type": "timeseries", "title": "Request Rate (req/s)", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "sum(rate(http_server_requests_seconds_count{service_name=~\"$service\"}[5m])) by (service_name)", "legendFormat": "{{service_name}}", "refId": "A"}], "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit": "reqps"}}},
                    {"id": 2, "type": "timeseries", "title": "Error Rate % (5xx)", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "sum(rate(http_server_requests_seconds_count{service_name=~\"$service\",status=~\"5..\"}[5m])) by (service_name) / sum(rate(http_server_requests_seconds_count{service_name=~\"$service\"}[5m])) by (service_name) * 100", "legendFormat": "{{service_name}}", "refId": "A"}], "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit": "percent", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}, {"color": "red", "value": 5}]}}}},
                    {"id": 3, "type": "timeseries", "title": "P95 Latency (s)", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{service_name=~\"$service\"}[5m])) by (le, service_name))", "legendFormat": "{{service_name}} p95", "refId": "A"}], "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit": "s"}}},
                    {"id": 4, "type": "timeseries", "title": "P99 Latency (s)", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{service_name=~\"$service\"}[5m])) by (le, service_name))", "legendFormat": "{{service_name}} p99", "refId": "A"}], "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit": "s"}}},
                    {"id": 5, "type": "timeseries", "title": "Request Rate by Endpoint (req/s)", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "sum(rate(http_server_requests_seconds_count{service_name=~\"$service\"}[5m])) by (service_name, uri)", "legendFormat": "{{service_name}} {{uri}}", "refId": "A"}], "gridPos": {"x": 0, "y": 16, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit": "reqps"}}},
                    {"id": 6, "type": "timeseries", "title": "Latency by Endpoint (p95)", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{service_name=~\"$service\"}[5m])) by (le, service_name, uri))", "legendFormat": "{{service_name}} {{uri}}", "refId": "A"}], "gridPos": {"x": 12, "y": 16, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit": "s"}}},
                    {"id": 7, "type": "stat", "title": "Total Requests (5m)", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "sum(increase(http_server_requests_seconds_count{service_name=~\"$service\"}[5m]))", "refId": "A", "instant": true}], "gridPos": {"x": 0, "y": 24, "w": 8, "h": 4}},
                    {"id": 8, "type": "stat", "title": "Error Count (5m)", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "sum(increase(http_server_requests_seconds_count{service_name=~\"$service\",status=~\"5..\"}[5m]))", "refId": "A", "instant": true}], "gridPos": {"x": 8, "y": 24, "w": 8, "h": 4}, "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}}},
                    {"id": 9, "type": "stat", "title": "Avg Latency (s)", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "sum(rate(http_server_requests_seconds_sum{service_name=~\"$service\"}[5m])) / sum(rate(http_server_requests_seconds_count{service_name=~\"$service\"}[5m]))", "refId": "A", "instant": true}], "gridPos": {"x": 16, "y": 24, "w": 8, "h": 4}, "fieldConfig": {"defaults": {"unit": "s"}}}
                  ]
                }
            trace-explorer:
              json: |-
                {
                  "schemaVersion": 39,
                  "uid": "trace-explorer",
                  "title": "Trace Explorer (Tempo)",
                  "tags": ["tcc","traces","tempo"],
                  "timezone": "browser",
                  "refresh": "30s",
                  "time": {"from": "now-1h", "to": "now"},
                  "templating": {
                    "list": [
                      {"name": "service", "type": "query", "datasource": {"type": "tempo", "uid": "tempo"}, "query": {"query": "resource.service.name"}, "refresh": 2, "includeAll": true, "current": {"text": "All", "value": ".*"}},
                      {"name": "minDuration", "type": "textbox", "default": "0ms"}
                    ]
                  },
                  "panels": [
                    {"id": 1, "type": "table", "title": "Recent Traces", "datasource": {"type": "tempo", "uid": "tempo"}, "targets": [{"refId": "A", "queryType": "traceql-search", "expr": "{ resource.service.name =~ \"$service\" } | duration > \"$minDuration\"", "limit": 20}], "gridPos": {"x": 0, "y": 0, "w": 24, "h": 12}},
                    {"id": 2, "type": "table", "title": "Error Traces", "datasource": {"type": "tempo", "uid": "tempo"}, "targets": [{"refId": "A", "queryType": "traceql-search", "expr": "{ resource.service.name =~ \"$service\" AND status = error }", "limit": 20}], "gridPos": {"x": 0, "y": 12, "w": 12, "h": 10}},
                    {"id": 3, "type": "table", "title": "Slow Traces (>500ms)", "datasource": {"type": "tempo", "uid": "tempo"}, "targets": [{"refId": "A", "queryType": "traceql-search", "expr": "{ resource.service.name =~ \"$service\" } | duration > 500ms", "limit": 20}], "gridPos": {"x": 12, "y": 12, "w": 12, "h": 10}},
                    {"id": 4, "type": "stat", "title": "Total Traces (1h)", "datasource": {"type": "tempo", "uid": "tempo"}, "targets": [{"refId": "A", "queryType": "traceql-search", "expr": "{ resource.service.name =~ \"$service\" }", "limit": 10000}], "gridPos": {"x": 0, "y": 22, "w": 8, "h": 4}},
                    {"id": 5, "type": "stat", "title": "Error Traces (1h)", "datasource": {"type": "tempo", "uid": "tempo"}, "targets": [{"refId": "A", "queryType": "traceql-search", "expr": "{ resource.service.name =~ \"$service\" AND status = error }", "limit": 10000}], "gridPos": {"x": 8, "y": 22, "w": 8, "h": 4}, "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}}},
                    {"id": 6, "type": "stat", "title": "Slow Traces >500ms (1h)", "datasource": {"type": "tempo", "uid": "tempo"}, "targets": [{"refId": "A", "queryType": "traceql-search", "expr": "{ resource.service.name =~ \"$service\" } | duration > 500ms", "limit": 10000}], "gridPos": {"x": 16, "y": 22, "w": 8, "h": 4}}
                  ]
                }
            pyroscope-profiles:
              json: |-
                {
                  "schemaVersion": 39,
                  "uid": "pyroscope-profiles",
                  "title": "Application Profiling (Pyroscope)",
                  "tags": ["tcc","profiling","pyroscope"],
                  "timezone": "browser",
                  "refresh": "30s",
                  "time": {"from": "now-1h", "to": "now"},
                  "templating": {
                    "list": [
                      {"name": "serviceName", "type": "textbox", "default": "catalogo"}
                    ]
                  },
                  "panels": [
                    {"id": 1, "type": "flamegraph", "title": "CPU Flame Graph", "datasource": {"type": "grafana-pyroscope-datasource", "uid": "pyroscope"}, "targets": [{"refId": "A", "queryType": "profile", "profileTypeId": "process_cpu:cpu:nanoseconds:cpu:nanoseconds", "expr": "{service_name=\"$serviceName\"}"}], "gridPos": {"x": 0, "y": 0, "w": 24, "h": 16}},
                    {"id": 2, "type": "flamegraph", "title": "Memory Flame Graph (alloc)", "datasource": {"type": "grafana-pyroscope-datasource", "uid": "pyroscope"}, "targets": [{"refId": "A", "queryType": "profile", "profileTypeId": "memory:alloc_space:bytes:space:bytes", "expr": "{service_name=\"$serviceName\"}"}], "gridPos": {"x": 0, "y": 16, "w": 24, "h": 16}},
                    {"id": 3, "type": "timeseries", "title": "CPU Usage Over Time", "datasource": {"type": "grafana-pyroscope-datasource", "uid": "pyroscope"}, "targets": [{"refId": "A", "queryType": "metrics", "profileTypeId": "process_cpu:cpu:nanoseconds:cpu:nanoseconds", "expr": "{service_name=\"$serviceName\"}"}], "gridPos": {"x": 0, "y": 32, "w": 12, "h": 8}},
                    {"id": 4, "type": "timeseries", "title": "Memory Allocation Over Time", "datasource": {"type": "grafana-pyroscope-datasource", "uid": "pyroscope"}, "targets": [{"refId": "A", "queryType": "metrics", "profileTypeId": "memory:alloc_space:bytes:space:bytes", "expr": "{service_name=\"$serviceName\"}"}], "gridPos": {"x": 12, "y": 32, "w": 12, "h": 8}}
                  ]
                }
            infra-health:
              json: |-
                {
                  "schemaVersion": 39,
                  "uid": "infra-health",
                  "title": "Observability Infra Health",
                  "tags": ["tcc","infra","health"],
                  "timezone": "browser",
                  "refresh": "30s",
                  "time": {"from": "now-1h", "to": "now"},
                  "panels": [
                    {"id": 1, "type": "stat", "title": "Mimir Push Rate (samples/s)", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "sum(rate(prometheus_remote_storage_samples_total[5m]))", "refId": "A", "instant": true}], "gridPos": {"x": 0, "y": 0, "w": 6, "h": 4}, "fieldConfig": {"defaults": {"unit": "ops"}}},
                    {"id": 2, "type": "stat", "title": "Mimir Push Errors (5m)", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "sum(increase(prometheus_remote_storage_samples_failed_total[5m]))", "refId": "A", "instant": true}], "gridPos": {"x": 6, "y": 0, "w": 6, "h": 4}, "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}}},
                    {"id": 3, "type": "stat", "title": "Tempo Spans Received (rate)", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "sum(rate(tempo_distributor_spans_received_total[5m]))", "refId": "A", "instant": true}], "gridPos": {"x": 12, "y": 0, "w": 6, "h": 4}, "fieldConfig": {"defaults": {"unit": "ops"}}},
                    {"id": 4, "type": "stat", "title": "Tempo MetricsGen Active Series", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "sum(tempo_metrics_generator_processor_active_series)", "refId": "A", "instant": true}], "gridPos": {"x": 18, "y": 0, "w": 6, "h": 4}},
                    {"id": 5, "type": "stat", "title": "Loki Logs Received (rate)", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "sum(rate(loki_distributor_lines_received_total[5m]))", "refId": "A", "instant": true}], "gridPos": {"x": 0, "y": 4, "w": 6, "h": 4}, "fieldConfig": {"defaults": {"unit": "ops"}}},
                    {"id": 6, "type": "stat", "title": "Alloy OTLP Metrics Received (rate)", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "sum(rate(otelcol_receiver_accepted_metric_points[5m]))", "refId": "A", "instant": true}], "gridPos": {"x": 6, "y": 4, "w": 6, "h": 4}, "fieldConfig": {"defaults": {"unit": "ops"}}},
                    {"id": 7, "type": "stat", "title": "Alloy Scrape Failures (5m)", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "sum(increase(prometheus_target_scrape_pool_targets_failed_total[5m]))", "refId": "A", "instant": true}], "gridPos": {"x": 12, "y": 4, "w": 6, "h": 4}, "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}}},
                    {"id": 8, "type": "stat", "title": "Pyroscope Profiles Received (rate)", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "sum(rate(pyroscope_distributor_received_samples_count[5m]))", "refId": "A", "instant": true}], "gridPos": {"x": 18, "y": 4, "w": 6, "h": 4}, "fieldConfig": {"defaults": {"unit": "ops"}}},
                    {"id": 9, "type": "timeseries", "title": "Mimir Push Rate (samples/s)", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "sum(rate(prometheus_remote_storage_samples_total[5m]))", "legendFormat": "samples/s", "refId": "A"}], "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit": "ops"}}},
                    {"id": 10, "type": "timeseries", "title": "Tempo Ingest Rate (spans/s)", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "sum(rate(tempo_distributor_spans_received_total[5m]))", "legendFormat": "spans/s", "refId": "A"}], "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit": "ops"}}},
                    {"id": 11, "type": "timeseries", "title": "Loki Ingest Rate (lines/s)", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "sum(rate(loki_distributor_lines_received_total[5m]))", "legendFormat": "lines/s", "refId": "A"}], "gridPos": {"x": 0, "y": 16, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit": "ops"}}},
                    {"id": 12, "type": "timeseries", "title": "Alloy Scrape Duration (s)", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "scrape_duration_seconds", "legendFormat": "{{job}}", "refId": "A"}], "gridPos": {"x": 12, "y": 16, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit": "s"}}},
                    {"id": 13, "type": "timeseries", "title": "Tempo MetricsGen Active Series", "datasource": {"type": "prometheus", "uid": "mimir"}, "targets": [{"expr": "sum(tempo_metrics_generator_processor_active_series)", "legendFormat": "active series", "refId": "A"}], "gridPos": {"x": 0, "y": 24, "w": 24, "h": 8}}
                  ]
                }
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true