apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: "1.8.2"
    helm:
      values: |
        alloy:
          configMap:
            content: |
              otelcol.receiver.otlp "default" {
                grpc {
                  endpoint = "0.0.0.0:4317"
                }
                http {
                  endpoint = "0.0.0.0:4318"
                }
                output {
                  metrics = [otelcol.processor.k8sattributes.default.input]
                  logs    = [otelcol.processor.k8sattributes.default.input]
                  traces  = [otelcol.processor.k8sattributes.default.input]
                }
              }

              otelcol.processor.k8sattributes "default" {
                output {
                  metrics = [otelcol.processor.batch.mimir.input]
                  logs    = [otelcol.exporter.otlphttp.loki.input]
                  traces  = [otelcol.exporter.otlp.tempo.input]
                }
                extract {
                  metadata = ["k8s.namespace.name", "k8s.pod.name", "k8s.node.name"]
                }
              }

              // --- Ponte Prometheus → OTel ---
              // prometheus.scrape produz dados do tipo Prometheus, mas
              // otelcol.processor.batch espera dados OTel. O receiver
              // abaixo converte o formato automaticamente.
              // ponytail: receiver único para todos os scrapes de infra.
              otelcol.receiver.prometheus "infra" {
                output {
                  metrics = [otelcol.processor.batch.mimir.input]
                }
              }

              otelcol.processor.batch "mimir" {
                send_batch_size = 1000
                timeout = "5s"
                output {
                  metrics = [otelcol.exporter.prometheus.mimir.input]
                }
              }

              // otelcol.exporter.prometheusremotewrite foi removido do Alloy;
              // o caminho suportado e otelcol.exporter.prometheus + prometheus.remote_write.
              otelcol.exporter.prometheus "mimir" {
                forward_to = [prometheus.remote_write.mimir.receiver]
              }

              prometheus.remote_write "mimir" {
                endpoint {
                  url = "http://mimir-gateway.observability.svc.cluster.local:80/api/v1/push"
                }
              }

              // --- Infra metrics: cAdvisor (kubelet), KSM, node-exporter ---
              // ponytail: scrape direto no kubelet:10250. AKS expõe cAdvisor em /metrics/cadvisor.
              // Se o node role retornar __address__ na porta errada, o relabel força 10250.
              discovery.kubernetes "nodes" {
                role = "node"
              }

              prometheus.relabel "cadvisor" {
                forward_to = [otelcol.receiver.prometheus.infra.receiver]
                rule {
                  source_labels = ["__address__"]
                  regex = "(.+):(\\d+)"
                  target_label = "__address__"
                  replacement = "$1:10250"
                  action = "replace"
                }
              }

              prometheus.scrape "cadvisor" {
                targets = discovery.kubernetes.nodes.targets
                forward_to = [prometheus.relabel.cadvisor.receiver]
                metrics_path = "/metrics/cadvisor"
                scheme = "https"
                tls_config {
                  insecure_skip_verify = true
                }
                bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
                job_name = "cadvisor"
                scrape_interval = "60s"
              }

              // ponytail: discovery por pod label. KSM service name = release name = kube-state-metrics.
              discovery.kubernetes "ksm_pod" {
                role = "pod"
                selectors {
                  role = "pod"
                  label = "app.kubernetes.io/name=kube-state-metrics"
                }
              }

              prometheus.scrape "ksm" {
                targets = discovery.kubernetes.ksm_pod.targets
                forward_to = [otelcol.receiver.prometheus.infra.receiver]
                job_name = "kube-state-metrics"
                honor_labels = true
                scrape_interval = "30s"
              }

              // ponytail: node-exporter é DaemonSet. Pod discovery garante 1 target por node.
              discovery.kubernetes "node_exporter_pods" {
                role = "pod"
                selectors {
                  role = "pod"
                  label = "app.kubernetes.io/name=prometheus-node-exporter"
                }
              }

              prometheus.scrape "node_exporter" {
                targets = discovery.kubernetes.node_exporter_pods.targets
                forward_to = [otelcol.receiver.prometheus.infra.receiver]
                job_name = "node-exporter"
                scrape_interval = "30s"
              }

              // --- App metrics: Spring Boot Actuator /prometheus (JVM + HTTP) ---
              // ponytail: discovery por pod label app no namespace app.
              // Porta 8080, path /prometheus (fixo no path-mapping do application.yml).
              // Relabel filtra apenas namespace=app e mapeia label app→service_name.
              discovery.kubernetes "app_pods" {
                role = "pod"
                selectors {
                  role = "pod"
                  label = "app"
                  field = "status.phase=Running"
                }
              }

              prometheus.relabel "app_services" {
                forward_to = [otelcol.receiver.prometheus.infra.receiver]
                rule {
                  action = "keep"
                  source_labels = ["__meta_kubernetes_namespace"]
                  regex = "app"
                }
                rule {
                  action = "replace"
                  source_labels = ["__meta_kubernetes_pod_label_app"]
                  target_label = "service_name"
                }
              }

              prometheus.scrape "app_services" {
                targets = discovery.kubernetes.app_pods.targets
                forward_to = [prometheus.relabel.app_services.receiver]
                job_name = "spring-boot"
                metrics_path = "/prometheus"
                scrape_interval = "15s"
                honor_labels = true
              }

              // --- Self-scrape: métricas internas dos componentes de observabilidade ---
              // ponytail: discovery.dns resolve os serviços via A records.
              // Cada serviço expõe /metrics em portas diferentes:
              //   alloy:12345  tempo:3200  loki:3100  mimir-gateway:80  pyroscope:4040
              // Sem isto, o dashboard "Infra Health" não tem dados no Mimir.
              discovery.dns "obs_alloy" {
                names = ["alloy.observability.svc.cluster.local"]
                type = "A"
                port = 12345
                refresh_interval = "60s"
              }

              prometheus.scrape "obs_alloy" {
                targets = discovery.dns.obs_alloy.targets
                forward_to = [otelcol.receiver.prometheus.infra.receiver]
                job_name = "obs-alloy"
                scrape_interval = "30s"
                metrics_path = "/metrics"
              }

              discovery.dns "obs_tempo" {
                names = ["tempo.observability.svc.cluster.local"]
                type = "A"
                port = 3200
                refresh_interval = "60s"
              }

              prometheus.scrape "obs_tempo" {
                targets = discovery.dns.obs_tempo.targets
                forward_to = [otelcol.receiver.prometheus.infra.receiver]
                job_name = "obs-tempo"
                scrape_interval = "30s"
                metrics_path = "/metrics"
              }

              discovery.dns "obs_loki" {
                names = ["loki.observability.svc.cluster.local"]
                type = "A"
                port = 3100
                refresh_interval = "60s"
              }

              prometheus.scrape "obs_loki" {
                targets = discovery.dns.obs_loki.targets
                forward_to = [otelcol.receiver.prometheus.infra.receiver]
                job_name = "obs-loki"
                scrape_interval = "30s"
                metrics_path = "/metrics"
              }

              discovery.dns "obs_mimir" {
                names = ["mimir-gateway.observability.svc.cluster.local"]
                type = "A"
                port = 80
                refresh_interval = "60s"
              }

              prometheus.scrape "obs_mimir" {
                targets = discovery.dns.obs_mimir.targets
                forward_to = [otelcol.receiver.prometheus.infra.receiver]
                job_name = "obs-mimir"
                scrape_interval = "30s"
                metrics_path = "/metrics"
              }

              discovery.dns "obs_pyroscope" {
                names = ["pyroscope.observability.svc.cluster.local"]
                type = "A"
                port = 4040
                refresh_interval = "60s"
              }

              prometheus.scrape "obs_pyroscope" {
                targets = discovery.dns.obs_pyroscope.targets
                forward_to = [otelcol.receiver.prometheus.infra.receiver]
                job_name = "obs-pyroscope"
                scrape_interval = "30s"
                metrics_path = "/metrics"
              }

              otelcol.exporter.otlphttp "loki" {
                client {
                  endpoint = "http://loki.observability.svc.cluster.local:3100/otlp"
                  tls {
                    insecure = true
                  }
                }
              }

              otelcol.exporter.otlp "tempo" {
                client {
                  endpoint = "tempo.observability.svc.cluster.local:4317"
                  tls {
                    insecure = true
                  }
                }
              }
          extraPorts:
            - name: otlp-grpc
              port: 4317
              targetPort: 4317
              protocol: TCP
            - name: otlp-http
              port: 4318
              targetPort: 4318
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 12345
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 12345
            initialDelaySeconds: 30
            periodSeconds: 15
        service:
          extraPorts:
            - name: otlp-grpc
              port: 4317
              targetPort: 4317
              protocol: TCP
            - name: otlp-http
              port: 4318
              targetPort: 4318
              protocol: TCP
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: false