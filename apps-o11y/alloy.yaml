apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: "1.8.2"
    helm:
      values: |
        alloy:
          configMap:
            content: |
              otelcol.receiver.otlp "default" {
                grpc {
                  endpoint = "0.0.0.0:4317"
                }
                http {
                  endpoint = "0.0.0.0:4318"
                }
                output {
                  metrics = [otelcol.processor.k8sattributes.default.input]
                  logs    = [otelcol.processor.k8sattributes.default.input]
                  traces  = [otelcol.processor.k8sattributes.default.input]
                }
              }

              otelcol.processor.k8sattributes "default" {
                output {
                  metrics = [otelcol.processor.batch.mimir.input]
                  logs    = [otelcol.exporter.otlphttp.loki.input]
                  traces  = [otelcol.exporter.otlp.tempo.input]
                }
                extract {
                  metadata = ["k8s.namespace.name", "k8s.pod.name", "k8s.node.name"]
                }
              }

              otelcol.processor.batch "mimir" {
                send_batch_size = 1000
                timeout = "5s"
                output {
                  metrics = [otelcol.exporter.prometheusremotewrite.mimir.input]
                }
              }

              otelcol.exporter.prometheusremotewrite "mimir" {
                endpoint {
                  url = "http://mimir-gateway.observability.svc.cluster.local:80/api/v1/push"
                }
              }

              otelcol.exporter.otlphttp "loki" {
                client {
                  endpoint = "http://loki.observability.svc.cluster.local:3100/otlp"
                  tls {
                    insecure = true
                  }
                }
              }

              otelcol.exporter.otlp "tempo" {
                client {
                  endpoint = "tempo.observability.svc.cluster.local:4317"
                  tls {
                    insecure = true
                  }
                }
              }
          extraPorts:
            - name: otlp-grpc
              port: 4317
              targetPort: 4317
              protocol: TCP
            - name: otlp-http
              port: 4318
              targetPort: 4318
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 12345
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 12345
            initialDelaySeconds: 30
            periodSeconds: 15
        service:
          extraPorts:
            - name: otlp-grpc
              port: 4317
              targetPort: 4317
              protocol: TCP
            - name: otlp-http
              port: 4318
              targetPort: 4318
              protocol: TCP
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
