apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: tempo
    targetRevision: "1.24.4"
    helm:
      values: |
        tempo:
          retention: 24h
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: "0.0.0.0:4317"
                http:
                  endpoint: "0.0.0.0:4318"
          # Chart monolítico (single-binary): replicas, distributors.*,
          # ingesters.*, queriers.* etc. não são chaves válidas deste chart —
          # elas existem apenas no chart `tempo-distributed`. O binário único
          # já roda todos os módulos, então basta manter receivers + retention.
          metricsGenerator:
            enabled: true
            remoteWriteUrl: "http://mimir-gateway.observability.svc.cluster.local:80/api/v1/push"
            processor:
              span_metrics:
                enable_target_info: true
              service_graphs:
                wait: 10s
                max_items: 10000

          # Habilita metrics_generator para o tenant single-tenant.
          # Sem overrides.defaults.metrics_generator.processors, o gerador
          # nunca enfileira spans para processar (enqueue_time=0).
          overrides:
            defaults:
              metrics_generator:
                processors:
                  - service-graphs
                  - span-metrics
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
