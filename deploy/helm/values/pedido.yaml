# Configuração do microserviço Pedido
# Spring Boot + Java 25 + OpenTelemetry nativo

fullnameOverride: pedido

replicaCount: 2

image:
  repository: acrctframework.azurecr.io/pedido
  tag: "latest"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: pedido.dorigao.dev.br
      paths:
        - path: /
          pathType: Prefix

# Environment variables — OpenTelemetry + Observabilidade
extraEnv:
  - name: OTEL_SERVICE_NAME
    value: "pedido"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://alloy.observability.svc.cluster.local:4318"
  - name: OTEL_RESOURCE_ATTRIBUTES_SERVICE_NAMESPACE
    value: "app"
  - name: DEPLOY_ENV
    value: "production"
  - name: LOG_LEVEL
    value: "INFO"
  - name: SERVER_PORT
    value: "8080"
  - name: PYROSCOPE_APPLICATION_NAME
    value: "pedido"
  - name: PYROSCOPE_SERVER_ADDRESS
    value: "http://pyroscope.observability.svc.cluster.local:4040"
  - name: JAVA_TOOL_OPTIONS
    value: "-javaagent:/opt/pyroscope/pyroscope.jar"

# Pyroscope Java agent — init container baixa o agent JAR
initContainers:
  - name: pyroscope-agent
    image: alpine:3.19
    command:
      - /bin/sh
      - -c
      - |
        set -ex
        echo "Installing curl..."
        apk add --no-cache curl ca-certificates
        
        echo "Downloading Pyroscope agent..."
        curl -fSL -o /opt/pyroscope/pyroscope.jar \
          https://github.com/grafana/pyroscope-java/releases/download/v2.5.4/pyroscope.jar
        
        if [ ! -s /opt/pyroscope/pyroscope.jar ]; then
          echo "ERROR: Pyroscope agent download failed or file is empty"
          exit 1
        fi
        
        echo "Pyroscope agent downloaded successfully"
        ls -lh /opt/pyroscope/pyroscope.jar
    securityContext:
      runAsUser: 0
      runAsGroup: 0
    volumeMounts:
      - name: pyroscope-agent
        mountPath: /opt/pyroscope

extraVolumes:
  - name: pyroscope-agent
    emptyDir: {}

extraVolumeMounts:
  - name: pyroscope-agent
    mountPath: /opt/pyroscope

# Recursos — sizing guide do NFR
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

# Health probes
livenessProbe:
  httpGet:
    path: /health/liveness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /health/readiness
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3

# Labels para Chaos Mesh (app usada para seleção de pods)
podLabels:
  app: pedido
