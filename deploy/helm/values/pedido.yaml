replicaCount: 2

image:
  repository: REPLACE_WITH_ACR/pedido
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: pedido.dorigao.dev.br
      paths:
        - path: /
          pathType: Prefix

env:
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://alloy.observability.svc.cluster.local:4318"
  - name: OTEL_SERVICE_NAME
    value: "pedido"
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: "service.namespace=app,service.name=pedido"
