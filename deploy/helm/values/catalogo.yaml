# Configuração do microserviço Catalogo
# Spring Boot + Java 25 + OpenTelemetry nativo

replicaCount: 2

image:
  # Substitua pelo seu ACR
  # Exemplo: acrctframework.azurecr.io/catalogo
  repository: <SEU_ACR>.azurecr.io/catalogo
  tag: "latest"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: catalogo.dorigao.dev.br
      paths:
        - path: /
          pathType: Prefix

# Environment variables — OpenTelemetry + Observabilidade
env:
  - name: OTEL_SERVICE_NAME
    value: "catalogo"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://alloy.observability.svc.cluster.local:4318"
  - name: OTEL_RESOURCE_ATTRIBUTES_SERVICE_NAMESPACE
    value: "app"
  - name: DEPLOY_ENV
    value: "production"
  - name: LOG_LEVEL
    value: "INFO"
  - name: SERVER_PORT
    value: "8080"

# Recursos — sizing guide do NFR
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

# Health probes
livenessProbe:
  httpGet:
    path: /health/liveness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /health/readiness
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3

# Labels para Chaos Mesh
podLabels:
  app: catalogo
  app.kubernetes.io/name: catalogo
